{% extends "base.html" %}
{% block title %}Sign Up - RoadFix LK{% endblock %}
{% block content %}
</div></main> <!-- Break out of default container for full-width background -->

<div class="auth-bg">
  <div class="container animate-entrance">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="glass-card p-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: var(--secondary-color);">Create Account</h2>
            <p class="text-muted">Join the community to start reporting road issues.</p>
          </div>
          <form method="POST" id="authForm">
            <div class="form-floating mb-3">
              <input type="text" name="full_name" class="form-control" id="floatingName" placeholder="John Doe" value="{{ form.get('full_name','') }}" required autofocus>
              <label for="floatingName">Full name</label>
            </div>
            <div class="form-floating mb-3">
              <input type="email" name="email" class="form-control" id="floatingEmail" placeholder="name@example.com" value="{{ form.get('email','') }}" required>
              <label for="floatingEmail">Email address</label>
            </div>
            <div class="form-floating mb-3">
              <input type="text" name="phone" class="form-control" id="floatingPhone" placeholder="07XXXXXXXX" value="{{ form.get('phone','') }}">
              <label for="floatingPhone">Phone number (optional)</label>
            </div>
            <div class="form-floating mb-4">
              <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" minlength="6" required>
              <label for="floatingPassword">Password</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill" id="submitBtn">
              <span id="btnText">Sign Up</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
            </button>
          </form>
          <div class="text-center mt-4">
            <p class="mb-0 text-muted">
              Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-semibold text-primary text-decoration-none">Log in here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Dummy tags to fix broken structure from breaking out -->
<main><div class="d-none">
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("authForm").addEventListener("submit", function() {
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    
    submitBtn.disabled = true;
    btnText.innerText = "Creating Account...";
    btnSpinner.classList.remove("d-none");
  });
</script>
{% endblock %}
