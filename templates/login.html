{% extends "base.html" %}
{% block title %}Login - RoadFix LK{% endblock %}
{% block content %}
</div></main> <!-- Break out of default container for full-width background -->

<div class="auth-bg">
  <div class="container animate-entrance">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="glass-card p-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: var(--secondary-color);">Welcome Back</h2>
            <p class="text-muted">Sign in to report and track road issues.</p>
          </div>
          <form method="POST" id="authForm">
            <div class="form-floating mb-3">
              <input type="email" name="email" class="form-control" id="floatingInput" placeholder="name@example.com" required autofocus>
              <label for="floatingInput">Email address</label>
            </div>
            <div class="form-floating mb-3">
              <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
              <label for="floatingPassword">Password</label>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
              <label class="form-check-label text-muted" for="rememberMe">
                Remember me
              </label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill" id="submitBtn">
              <span id="btnText">Sign In</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
            </button>
          </form>
          <div class="text-center mt-4">
            <p class="mb-0 text-muted">
              Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary text-decoration-none">Create one</a>
            </p>
            <p class="mt-3 mb-0 text-muted small">
              Demo admin: <code class="bg-light px-2 py-1 rounded">admin@roadfix.lk</code> / <code class="bg-light px-2 py-1 rounded">admin123</code>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Dummy tags to fix broken structure from breaking out -->
<main><div class="d-none">
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("authForm").addEventListener("submit", function() {
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    
    submitBtn.disabled = true;
    btnText.innerText = "Signing In...";
    btnSpinner.classList.remove("d-none");
  });
</script>
{% endblock %}
