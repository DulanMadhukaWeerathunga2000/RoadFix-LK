{% extends "base.html" %}
{% block title %}Login - RoadFix LK{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3 text-center fw-bold" style="color: var(--secondary-color);">Login</h4>
        <form method="POST" id="authForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="submitBtn">
            <span id="btnText">Login</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
          </button>
        </form>
        <p class="mt-3 mb-0 text-muted small">
          No account? <a href="{{ url_for('auth.register') }}">Sign up</a>
        </p>
        <p class="mt-2 mb-0 text-muted small">
          Demo admin: <code>admin@roadfix.lk</code> / <code>admin123</code>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("authForm").addEventListener("submit", function() {
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    
    submitBtn.disabled = true;
    btnText.innerText = "Please wait...";
    btnSpinner.classList.remove("d-none");
  });
</script>
{% endblock %}
